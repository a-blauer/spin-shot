html, body { margin: 0; height: 100%; overflow: hidden; background: #160c12; color: #f2e8d5; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; user-select: none; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
#hud { pointer-events: auto; }
#title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
  background: radial-gradient(ellipse at 50% 45%, rgba(40,14,24,0.35) 0%, rgba(18,8,14,0.85) 70%); }
#title h1 { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 400; font-size: clamp(56px, 10vw, 150px); line-height: 0.9; margin: 0; letter-spacing: 1px;
  color: #c8211b; -webkit-text-stroke: 3px #140d12; text-shadow: 0 6px 0 #140d12; transform: rotate(-2deg); }
#title .sub { font-family: "Big Shoulders Display"; font-size: clamp(18px, 2.2vw, 30px); color: #ffcd5a; letter-spacing: 6px; margin-top: 10px; -webkit-text-stroke: 1px #140d12; }
#title .cards { display: flex; gap: 10px; margin: 18px 0 8px; }
#title .card { width: 46px; height: 64px; background: #f2e8d5; border: 3px solid #140d12; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-family: "Big Shoulders Display"; font-size: 24px; color: #140d12; transform: rotate(var(--r)); box-shadow: 0 4px 0 #140d12; }
#title .card.red { color: #c8211b; }
#title .controls { display: grid; grid-template-columns: repeat(4, auto); gap: 9px 26px; margin-top: 22px; font-size: 15px; font-weight: 600; color: #d9cfbd;
  background: rgba(20,10,16,0.82); border: 2px solid #ffcd5a; padding: 14px 22px; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
#title .controls b { display: inline-block; min-width: 14px; text-align: center; font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 400; font-size: 13px; letter-spacing: 0.5px; color: #140d12; background: #f2e8d5; padding: 1px 6px; margin-right: 6px; border-radius: 4px; box-shadow: 0 2px 0 #140d12; }
#title .controls span { white-space: nowrap; }
#title .go { font-family: "Big Shoulders Display"; font-size: 34px; margin-top: 24px; color: #ffcd5a; letter-spacing: 2px; -webkit-text-stroke: 1px #140d12; animation: pulse 1.2s ease-in-out infinite; }
#title .blurb { max-width: 760px; text-align: center; font-size: 17px; color: #cfc5b4; margin-top: 14px; font-weight: 600; text-shadow: 0 2px 0 #140d12; }
#loading { font-family: "Big Shoulders Display"; font-size: 26px; color: #ffcd5a; margin-top: 24px; }
body.ready #loading { display: none; }
body:not(.ready) .go { display: none; }

#title .menu { display: flex; flex-direction: column; gap: 12px; margin-top: 34px; width: min(300px, 70vw); }
#title .menu button { font-family: "Big Shoulders Display"; font-size: 26px; letter-spacing: 3px; padding: 10px 22px; color: #140d12; background: #f2e8d5; border: 0; border-radius: 6px; box-shadow: 0 5px 0 #140d12; cursor: pointer; }
#title .menu #playbtn { background: #ffcd5a; font-size: 34px; }
body:not(.ready) #title .menu { display: none; }
#title { cursor: default !important; }
#pause.menu #prestart, #pause.menu #pquit, #pause.menu #pdmg { display: none; }
#pdmg { font-family: "Barlow Condensed", sans-serif; color: #f2e8d5; font-size: 16px; margin: 10px 0 14px; max-width: 420px; } #pdmg h3 { font-family: "Big Shoulders Display"; color: #ffcd5a; font-size: 18px; letter-spacing: 2px; margin: 0 0 6px; } #pdmg div { padding: 2px 0; } #pdmg b { display: inline-block; width: 44px; color: #ff8a80; } #pdmg i { color: #9a8f86; font-style: normal; }
#oldbtn { font-family: "Big Shoulders Display"; font-size: 20px; letter-spacing: 2px; margin-top: 16px; padding: 8px 22px; color: #140d12; background: #ffcd5a; border: 0; border-radius: 6px; box-shadow: 0 4px 0 #140d12; cursor: pointer; }
body:not(.ready) #title .menu { display: flex; flex-direction: column; gap: 12px; margin-top: 34px; width: min(300px, 70vw); }
#title .menu button { font-family: "Big Shoulders Display"; font-size: 26px; letter-spacing: 3px; padding: 10px 22px; color: #140d12; background: #f2e8d5; border: 0; border-radius: 6px; box-shadow: 0 5px 0 #140d12; cursor: pointer; }
#title .menu #playbtn { background: #ffcd5a; font-size: 34px; }
body:not(.ready) #title .menu { display: none; }
#title { cursor: default !important; }
#pause.menu #prestart, #pause.menu #pquit { display: none; }
#oldbtn { display: none; }
#locker { display: none; position: fixed; inset: 3vh 3vw; overflow: auto; cursor: default; background: rgba(20,10,16,0.97); border: 2px solid #ffcd5a; padding: 16px 22px; z-index: 6; color: #f2e8d5; font-family: "Barlow Condensed", sans-serif; }
#locker .ph { display: flex; align-items: center; gap: 16px; } #locker h2 { font-family: "Big Shoulders Display"; font-size: 38px; margin: 0; color: #ffcd5a; letter-spacing: 2px; flex: 1; }
#locker .lcount { font-size: 18px; color: #c9bfae; }
#locker button { font-family: "Big Shoulders Display"; font-size: 17px; letter-spacing: 2px; padding: 6px 14px; color: #140d12; background: #ffcd5a; border: 0; border-radius: 6px; box-shadow: 0 3px 0 #000; cursor: pointer; }
#locker .lwrap { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 10px; }
#locker canvas { position: static; display: block; flex: none; width: min(360px, 80vw); height: auto; aspect-ratio: 360/460; background: radial-gradient(circle at 50% 40%, #4a2632, #1a0e14 75%); border: 2px solid #3a2430; border-radius: 8px; touch-action: none; cursor: grab; }
#locker .lside { flex: 1; min-width: 260px; } #locker .ltabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
#locker .ltab { background: #2a1820; color: #f2e8d5; box-shadow: none; border: 1px solid #6a4a52; } #locker .ltab.on { background: #c8211b; border-color: #c8211b; }
#locker .lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
#locker .litem { background: rgba(255,255,255,0.06); border: 2px solid transparent; border-radius: 6px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 74px; }
#locker .litem b { font-size: 19px; } #locker .litem span { font-size: 15px; color: #c9bfae; } #locker .litem.sel { border-color: #ffcd5a; background: rgba(255,205,90,0.12); }
#locker .litem.locked { opacity: 0.5; cursor: default; } #locker .litem.locked span { color: #ff9a4d; }
#locker .lsw { display: flex; height: 10px; border-radius: 3px; overflow: hidden; } #locker .lsw i { flex: 1; }
#lobby { display: none; position: fixed; inset: 3vh 3vw; overflow: auto; cursor: default; background: rgba(20,10,16,0.95); border: 2px solid #ffcd5a; padding: 16px 24px 22px; z-index: 5; color: #f2e8d5; font-family: "Barlow Condensed", sans-serif; font-size: 18px; }
#lobby .lbh { display: flex; align-items: center; } #lobby h2 { font-family: "Big Shoulders Display"; font-size: 42px; margin: 0; color: #ffcd5a; letter-spacing: 3px; flex: 1; }
#lobby h3 { font-family: "Big Shoulders Display"; font-size: 21px; letter-spacing: 2px; margin: 0 0 10px; color: #c8211b; }
#lobby .lbgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin: 12px 0 16px; }
#lobby section { background: rgba(255,255,255,0.05); border-top: 3px solid #c8211b; padding: 12px 14px; }
#lobby button { font-family: "Big Shoulders Display"; font-size: 18px; letter-spacing: 2px; padding: 7px 16px; color: #140d12; background: #ffcd5a; border: 0; border-radius: 6px; box-shadow: 0 3px 0 #000; cursor: pointer; }
#lobby button.wide { width: 100%; margin-top: 8px; } #lobby button.alt { background: #f2e8d5; }
#lobby input { font: inherit; padding: 5px 8px; background: #2a1820; color: #f2e8d5; border: 1px solid #6a4a52; border-radius: 4px; min-width: 0; }
#lobby .lbl { display: flex; align-items: center; gap: 8px; margin: 10px 0 2px; } #lobby .lbl input { flex: 1; }
#lobby .lbjoin { display: flex; gap: 8px; } #lobby .lbjoin input { flex: 1; text-transform: uppercase; letter-spacing: 4px; }
#lobby .lbor { text-align: center; color: #9a8f86; margin: 12px 0 6px; font-size: 15px; }
#lobby .lbrow { display: flex; justify-content: space-between; padding: 7px 10px; margin-bottom: 5px; background: rgba(255,255,255,0.06); border-left: 4px solid #6a4a52; } #lobby .lbrow.me { border-left-color: #ffcd5a; } #lobby .lbrow span { color: #c9bfae; font-size: 15px; }
#lobby .lbcode { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 8px 12px; background: #2a1820; border: 1px dashed #ffcd5a; } #lobby .lbcode span { font-size: 14px; letter-spacing: 2px; color: #c9bfae; } #lobby .lbcode b { font-family: "Big Shoulders Display"; font-size: 34px; letter-spacing: 6px; color: #ffcd5a; user-select: all; }
#lobby .dim { color: #9a8f86; font-size: 15px; margin: 6px 0; } #lobby .msg { color: #ff9a4d; min-height: 20px; margin: 8px 0 0; font-size: 16px; }
#lobby .lbchar { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; } #lobby .lbchar span { display: block; font-size: 12px; letter-spacing: 2px; color: #9a8f86; } #lobby .lbchar b { font-size: 17px; }
