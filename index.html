html, body { margin: 0; height: 100%; overflow: hidden; background: #160c12; color: #f2e8d5; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; user-select: none; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
#hud { pointer-events: auto; }
#title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
  background: radial-gradient(ellipse at 50% 45%, rgba(40,14,24,0.35) 0%, rgba(18,8,14,0.85) 70%); }
#title h1 { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 400; font-size: clamp(56px, 10vw, 150px); line-height: 0.9; margin: 0; letter-spacing: 1px;
  color: #c8211b; -webkit-text-stroke: 3px #140d12; text-shadow: 0 6px 0 #140d12; transform: rotate(-2deg); }
#title .sub { font-family: "Big Shoulders Display"; font-size: clamp(18px, 2.2vw, 30px); color: #ffcd5a; letter-spacing: 6px; margin-top: 10px; -webkit-text-stroke: 1px #140d12; }
#title .cards { display: flex; gap: 10px; margin: 18px 0 8px; }
#title .card { width: 46px; height: 64px; background: #f2e8d5; border: 3px solid #140d12; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-family: "Big Shoulders Display"; font-size: 24px; color: #140d12; transform: rotate(var(--r)); box-shadow: 0 4px 0 #140d12; }
#title .card.red { color: #c8211b; }
#title .controls { display: grid; grid-template-columns: repeat(4, auto); gap: 9px 26px; margin-top: 22px; font-size: 15px; font-weight: 600; color: #d9cfbd;
  background: rgba(20,10,16,0.82); border: 2px solid #ffcd5a; padding: 14px 22px; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
#title .controls b { display: inline-block; min-width: 14px; text-align: center; font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 400; font-size: 13px; letter-spacing: 0.5px; color: #140d12; background: #f2e8d5; padding: 1px 6px; margin-right: 6px; border-radius: 4px; box-shadow: 0 2px 0 #140d12; }
#title .controls span { white-space: nowrap; }
#title .go { font-family: "Big Shoulders Display"; font-size: 34px; margin-top: 24px; color: #ffcd5a; letter-spacing: 2px; -webkit-text-stroke: 1px #140d12; animation: pulse 1.2s ease-in-out infinite; }
#title .blurb { max-width: 760px; text-align: center; font-size: 17px; color: #cfc5b4; margin-top: 14px; font-weight: 600; text-shadow: 0 2px 0 #140d12; }
#loading { font-family: "Big Shoulders Display"; font-size: 26px; color: #ffcd5a; margin-top: 24px; }
body.ready #loading { display: none; }
body:not(.ready) .go { display: none; }

#title .menu { display: flex; flex-direction: column; gap: 12px; margin-top: 34px; width: min(300px, 70vw); }
#title .menu button { font-family: "Big Shoulders Display"; font-size: 26px; letter-spacing: 3px; padding: 10px 22px; color: #140d12; background: #f2e8d5; border: 0; border-radius: 6px; box-shadow: 0 5px 0 #140d12; cursor: pointer; }
#title .menu #playbtn { background: #ffcd5a; font-size: 34px; }
body:not(.ready) #title .menu { display: none; }
#title { cursor: default !important; }
#pause.menu #prestart, #pause.menu #pquit, #pause.menu #pdmg { display: none; }
#pdmg { font-family: "Barlow Condensed", sans-serif; color: #f2e8d5; font-size: 16px; margin: 10px 0 14px; max-width: 420px; } #pdmg h3 { font-family: "Big Shoulders Display"; color: #ffcd5a; font-size: 18px; letter-spacing: 2px; margin: 0 0 6px; } #pdmg div { padding: 2px 0; } #pdmg b { display: inline-block; width: 44px; color: #ff8a80; } #pdmg i { color: #9a8f86; font-style: normal; }
#oldbtn { font-family: "Big Shoulders Display"; font-size: 20px; letter-spacing: 2px; margin-top: 16px; padding: 8px 22px; color: #140d12; background: #ffcd5a; border: 0; border-radius: 6px; box-shadow: 0 4px 0 #140d12; cursor: pointer; }
body:not(.ready) #title .menu { display: flex; flex-direction: column; gap: 12px; margin-top: 34px; width: min(300px, 70vw); }
#title .menu button { font-family: "Big Shoulders Display"; font-size: 26px; letter-spacing: 3px; padding: 10px 22px; color: #140d12; background: #f2e8d5; border: 0; border-radius: 6px; box-shadow: 0 5px 0 #140d12; cursor: pointer; }
#title .menu #playbtn { background: #ffcd5a; font-size: 34px; }
body:not(.ready) #title .menu { display: none; }
#title { cursor: default !important; }
#pause.menu #prestart, #pause.menu #pquit { display: none; }
#oldbtn { display: none; }
#locker { display: none; position: fixed; inset: 3vh 3vw; overflow: auto; cursor: default; background: rgba(20,10,16,0.97); border: 2px solid #ffcd5a; padding: 16px 22px; z-index: 6; color: #f2e8d5; font-family: "Nunito", sans-serif, sans-serif; }
#locker .ph { display: flex; align-items: center; gap: 16px; } #locker h2 { font-family: "Fraunces", Georgia, serif; font-size: 38px; margin: 0; color: #ffcd5a; letter-spacing: 0.5px; flex: 1; }
#locker .lcount { font-size: 18px; color: #c9bfae; }
#locker button { font-family: "Fraunces", Georgia, serif; font-size: 17px; letter-spacing: 0.5px; padding: 6px 14px; color: #140d12; background: #ffcd5a; border: 0; border-radius: 6px; box-shadow: 0 3px 0 #000; cursor: pointer; }
#locker { display: none; flex-direction: column; overflow: hidden !important; }
#locker[style*="block"] { display: flex !important; }

/* ===== polish layer: one set of tokens, one panel style, one button behaviour ===== */
:root { --ink:#140d12; --panel:#1a0f16; --panel2:#231520; --bone:#f2e8d5; --text:#e6dcc8; --mute:#b9ad98; --dim:#8f8478; --gold:#ffcd5a; --red:#c8211b; --good:#7dff8a; --line:rgba(255,205,90,0.22); --edge:rgba(255,205,90,0.55); --scrim:rgba(8,4,8,0.74); }
/* every menu window: solid, rounded, on a scrim, so nothing behind it reads through */
#progress, #lobby, #locker, #coop { background: var(--panel) !important; border: 1px solid var(--edge) !important; border-radius: 12px; box-shadow: 0 0 0 100vmax var(--scrim), 0 24px 70px rgba(0,0,0,0.6); }
#lobby .lbfoot { border-radius: 0 0 12px 12px; border-top: 1px solid var(--edge); }
#pause { background: rgba(8,4,8,0.5); backdrop-filter: blur(3px); }
#pause.menu { background: var(--scrim); }
@media (max-width: 900px) { #lobby { border-radius: 0; } }
/* buttons: lift on hover, press on click, a ring for the keyboard */
button { transition: transform 0.08s ease, filter 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease; }
button:not(:disabled):hover { filter: brightness(1.08); }
button:not(:disabled):active { transform: translateY(2px); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#title .menu button:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink); }
#title .menu button:not(:disabled):active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
/* headings share one scale: window title 40, section 20, label 15 */
#lobby h2, #progress h2, #locker h2 { font-size: 40px; letter-spacing: 2px; }
/* the title screen's footer line */
#title .tfoot { position: fixed; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 16px; font-weight: 600; color: var(--mute); letter-spacing: 1px; text-shadow: 0 2px 0 var(--ink); pointer-events: none; }
#title .tfoot b { font-family: "Big Shoulders Display"; font-weight: 400; color: var(--gold); letter-spacing: 2px; font-size: 18px; margin-right: 8px; }
body:not(.ready) #title .tfoot { display: none; }
/* settings / pause: two columns, grouped, values read as units */
#pause .pbox { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 22px 30px 24px; width: min(940px, 94vw); box-sizing: border-box; max-height: 94vh; overflow-y: auto; box-shadow: 0 24px 70px rgba(0,0,0,0.6); }
#pause .phd { display: flex; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 6px; }
#pause h2 { font-size: 44px; margin: 0; letter-spacing: 2px; }
#pause .pcols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 36px; }
#pause .psec { font-family: "Big Shoulders Display"; font-weight: 400; font-size: 18px; letter-spacing: 3px; color: var(--gold); margin: 16px 0 4px; }
#pause label { grid-template-columns: 140px 1fr 52px; margin: 6px 0; color: var(--text); }
#pause label b { font-family: "Big Shoulders Display"; font-weight: 400; font-size: 19px; }
#pause .pfs { margin-top: 12px; max-width: none; }
#pause .pfs span { font-size: 14px; color: var(--mute); }
#pause .pradio { margin-top: 0; padding-top: 0; border-top: 0; max-width: none; }
#pause .prh .psec { margin: 16px 0 4px; } #pause .prh span { padding-top: 10px; }
#pause .prh button, #pause .pfs button { font-size: 16px; padding: 6px 12px; border-radius: 6px; }
#pause #prlist { background: rgba(0,0,0,0.25); border-radius: 6px; padding: 4px 8px; min-height: 22px; }
#pause #prlist:empty::before { content: "No songs added."; color: var(--dim); }
#pause #pdmg { margin: 14px 0 4px; max-width: none; background: rgba(200,33,27,0.08); border-left: 3px solid var(--red); padding: 8px 12px; border-radius: 0 6px 6px 0; }
#pause #pdmg:empty { display: none; }
#pause .pbtns { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 20px; }
#pause button { border-radius: 6px; box-shadow: 0 3px 0 #000; }
#pause .pbtns #pquit { background: transparent; color: var(--bone); border: 1px solid rgba(242,232,213,0.4); box-shadow: none; }
@media (max-width: 760px) { #pause .pcols { grid-template-columns: 1fr; } }
/* progress: rewards as tags, the rank you are working toward picked out */
#progress .tg { display: inline-block; text-decoration: none; padding: 1px 7px 2px; margin: 2px 5px 2px 0; border-radius: 4px; background: rgba(255,255,255,0.07); border-left: 3px solid rgba(255,255,255,0.25); color: var(--text); font-weight: 600; line-height: 1.35; }
#progress .tg i { font-style: normal; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); margin-left: 6px; }
#progress .tg.k-machine { border-left-color: #9affc0; } #progress .tg.k-hat, #progress .tg.k-outfit, #progress .tg.k-back, #progress .tg.k-belt, #progress .tg.k-waist, #progress .tg.k-on, #progress .tg.k-face, #progress .tg.k-gloves { border-left-color: #ff8cff; } #progress .tg.k-renown { border-left-color: var(--gold); color: var(--gold); } #progress .tg.k-part { border-left-color: #8fd0ff; } #progress .tg.k-gun { border-left-color: var(--gold); } #progress .tg.k-heirloom, #progress .tg.k-buff { border-left-color: #ff9a4d; }
#progress .pc { border-radius: 0 8px 8px 0; }
#progress .pc.locked { opacity: 0.72; }
#progress .pc.locked .tg { color: var(--mute); }
#progress .pc.next { opacity: 1; border-left-color: var(--gold); background: rgba(255,205,90,0.07); box-shadow: inset 0 0 0 1px rgba(255,205,90,0.35); }
#progress .pc.next .pt b::after { content: "NEXT"; font: 700 11px "Barlow Condensed"; letter-spacing: 1.5px; color: var(--ink); background: var(--gold); padding: 1px 6px; border-radius: 3px; margin-left: 4px; }
#progress .prw em { color: var(--gold); }
#progress .renown { border-radius: 8px; }
#progress .ptabs button, #lobby .lbpick, #locker .ltab { transition: background-color 0.12s, color 0.12s, border-color 0.12s; }
#progress .ptabs button:not(.on):hover { background: rgba(255,255,255,0.12); color: var(--bone); }
#locker .ltab:not(.on):hover { background: #3a2430; }
/* lobby: sections read as cards, the start button is the one loud thing */
#lobby section { border: 1px solid rgba(255,255,255,0.05); }
#lobby #lbline { position: static; inset: auto; display: block; width: 100%; height: auto; aspect-ratio: 536 / 400; margin: -4px 0 10px; border-radius: 8px; background: radial-gradient(ellipse at 50% 85%, #4a2632 0%, #22121a 60%, rgba(0,0,0,0) 100%); }
#lobby .lbpick.sel { box-shadow: 0 0 0 1px rgba(255,205,90,0.25); }
#lobby .lbstart { box-shadow: 0 4px 0 #000; }
/* locker: every slider card the same width */
#locker .lsl { border: 1px solid rgba(255,255,255,0.04); }
#locker .lsl2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
/* thin, quiet scrollbars everywhere */
* { scrollbar-width: thin; scrollbar-color: rgba(255,205,90,0.35) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255,205,90,0.3); border-radius: 4px; } ::-webkit-scrollbar-track { background: transparent; }
@media (prefers-reduced-motion: reduce) { button, #title .menu button { transition: none; } #title .go, #lobby .lbstart.wait { animation: none; } }
/* ---- the village's windows: the shop, the challenge board and the casino games. Clean cards on a dim backdrop. */
#vpanel { display: none; position: fixed; inset: 0; z-index: 6; align-items: center; justify-content: center; background: rgba(20,12,8,0.5); backdrop-filter: blur(3px); cursor: default; color: #f6ead6; font-family: "Nunito", sans-serif; font-weight: 700; }

#vpanel .note .vp-btn { margin-top: 4px; }

#vpanel .note .stamp { position: absolute; top: 18px; right: 14px; transform: rotate(10deg); font-family: "Fraunces", Georgia, serif; font-size: 26px; letter-spacing: 0.6px; padding: 2px 10px; border: 3px solid; border-radius: 6px; opacity: 0.85; }
#vpanel .note .stamp.t { color: #2a7aa8; } .note .stamp.p { color: #2a8a3a; }
#vpanel .note.done { opacity: 0.75; }
/* the casino */
#vpanel .cas { flex: 1; display: flex; gap: 0; min-height: 0; }
#vpanel .cas-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 22px; background: radial-gradient(ellipse at 50% 45%, #1f4a33 0%, #143022 55%, #0f2219 100%); position: relative; }
#vpanel .cas-side { width: 300px; flex: none; padding: 20px 22px; border-left: 1px solid rgba(255,205,90,0.12); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
#vpanel .cas-side h4 { margin: 0; font-family: "Fraunces", Georgia, serif; font-weight: 900; font-size: 18px; letter-spacing: 0.6px; color: #ffcd5a; }
#vpanel .cas-side p { margin: 0; font-size: 15px; color: #b8aa9a; line-height: 1.25; }
#vpanel .chips { display: flex; flex-wrap: wrap; gap: 8px; }
#vpanel .chip { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: "Fraunces", Georgia, serif; font-size: 17px; color: #fff; cursor: pointer; border: 4px dashed rgba(255,255,255,0.75); box-shadow: 0 3px 0 rgba(0,0,0,0.4); transition: transform 0.08s; }
#vpanel .chip:hover { transform: translateY(-2px); }
#vpanel .chip.on { outline: 3px solid #ffcd5a; outline-offset: 2px; }
#vpanel .chip.off { opacity: 0.3; cursor: default; }
#vpanel .msg { min-height: 34px; font-family: "Fraunces", Georgia, serif; font-size: 30px; letter-spacing: 0.4px; text-align: center; color: #f2e8d5; text-shadow: 0 3px 0 rgba(0,0,0,0.5); }
#vpanel .msg.win { color: #ffcd5a; } .msg.lose { color: #ff9a8a; }
#vpanel .paytab { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; font-size: 16px; }
#vpanel .paytab .sy { display: flex; gap: 2px; } .paytab .sy svg { width: 22px; height: 22px; } .paytab b { color: #ffcd5a; font-family: "Fraunces", Georgia, serif; font-size: 18px; text-align: right; }
#vpanel .hist { display: flex; gap: 5px; flex-wrap: wrap; } .hist span { min-width: 30px; text-align: center; padding: 3px 6px; border-radius: 6px; font-family: "Fraunces", Georgia, serif; font-size: 17px; }
/* slots */
#vpanel .slot-face { padding: 22px 26px; border-radius: 22px; background: linear-gradient(180deg, #c8392e, #8a1e1a); box-shadow: 0 16px 40px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.2); display: flex; flex-direction: column; align-items: center; gap: 14px; }
#vpanel .slot-face .nm { font-family: "Fraunces", Georgia, serif; font-size: 26px; letter-spacing: 0.8px; color: #ffe9a0; text-shadow: 0 2px 0 #5a0e0a; }
#vpanel .reels { display: flex; gap: 12px; padding: 14px; border-radius: 14px; background: #2a0e0c; box-shadow: inset 0 4px 12px rgba(0,0,0,0.7); }
#vpanel .reel { width: 120px; height: 300px; overflow: hidden; border-radius: 10px; background: linear-gradient(180deg, #d8ccb0 0%, #fbf4e6 30%, #fbf4e6 70%, #d8ccb0 100%); position: relative; }
#vpanel .reel::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: rgba(200,57,46,0.5); }
#vpanel .strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
#vpanel .strip div { height: 100px; display: flex; align-items: center; justify-content: center; } .strip svg { width: 70px; height: 70px; }
/* roulette */
#vpanel .rou { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; justify-content: center; }
#vpanel .rou canvas { position: static !important; width: 300px !important; height: 300px !important; inset: auto !important; }
#vpanel .layout { display: grid; grid-template-columns: 46px repeat(12, 40px); grid-template-rows: repeat(3, 40px) 36px 36px; gap: 3px; }
#vpanel .layout div { display: flex; align-items: center; justify-content: center; border-radius: 6px; font-family: "Fraunces", Georgia, serif; font-size: 18px; color: #fff; cursor: pointer; position: relative; border: 1px solid rgba(255,255,255,0.15); }
#vpanel .layout div:hover { filter: brightness(1.25); }
#vpanel .layout .r { background: #b82a2a; } .layout .k { background: #1a1a1a; } .layout .z { background: #2a8a3a; grid-row: 1 / 4; } .layout .o { background: rgba(255,255,255,0.08); font-size: 15px; letter-spacing: 0.2px; }
#vpanel .layout .bet::after { content: attr(data-b); position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 11px; background: #ffcd5a; color: #140d12; font-size: 13px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
#vpanel .layout .hit { outline: 3px solid #ffcd5a; z-index: 2; }
/* blackjack */
#vpanel .bj { display: flex; flex-direction: column; gap: 18px; align-items: center; width: 100%; }
#vpanel .hand { display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 160px; }
#vpanel .hand .lb { font-size: 15px; letter-spacing: 0.4px; color: #cfe8d8; text-transform: uppercase; }
#vpanel .hand .lb b { font-family: "Fraunces", Georgia, serif; font-size: 22px; color: #fff; margin-left: 6px; }
#vpanel .cards { display: flex; gap: 8px; }
#vpanel .card { width: 82px; height: 116px; border-radius: 9px; background: #fbf8f0; color: #1a1a1a; box-shadow: 0 6px 14px rgba(0,0,0,0.45); position: relative; font-family: "Fraunces", Georgia, serif; animation: deal 0.25s ease-out; }
#vpanel .card.red { color: #c8281e; }
#vpanel .card .c1 { position: absolute; top: 6px; left: 8px; font-size: 24px; line-height: 0.9; text-align: center; } .card .c2 { position: absolute; bottom: 6px; right: 8px; font-size: 24px; line-height: 0.9; transform: rotate(180deg); text-align: center; }
#vpanel .card .pip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 44px; }
#vpanel .card.back { background: repeating-linear-gradient(45deg, #8a1e1a 0 8px, #b8392e 8px 16px); border: 5px solid #fbf8f0; }
@keyframes deal { from { transform: translateY(-30px) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
#vpanel .acts { display: flex; gap: 10px; }
/* dice */
#vpanel .dice { display: flex; flex-direction: column; align-items: center; gap: 16px; width: min(560px, 100%); }
#vpanel .roll { font-family: "Fraunces", Georgia, serif; font-size: 120px; line-height: 1; color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,0.45); min-height: 120px; }
#vpanel .bar { position: relative; width: 100%; height: 22px; border-radius: 11px; background: #8a1e1a; overflow: hidden; }
#vpanel .bar i { position: absolute; top: 0; bottom: 0; background: #3a9a4a; }
#vpanel .bar em { position: absolute; top: -6px; width: 4px; height: 34px; background: #fff; border-radius: 2px; margin-left: -2px; transition: left 0.5s cubic-bezier(.2,.9,.3,1.2); }
#vpanel .dice input[type=range] { width: 100%; accent-color: #ffcd5a; }
#vpanel .seg { display: flex; border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,255,255,0.25); }
#vpanel .seg button { font-family: "Fraunces", Georgia, serif; font-size: 20px; letter-spacing: 0.4px; padding: 8px 22px; border: 0; background: transparent; color: #f2e8d5; cursor: pointer; }
#vpanel .seg button.on { background: #ffcd5a; color: #140d12; }
#vpanel .odds { display: flex; gap: 26px; font-size: 16px; color: #cfe8d8; } .odds b { font-family: "Fraunces", Georgia, serif; font-size: 26px; color: #fff; display: block; }
@media (max-width: 900px) { #vpanel .shop-left { width: 300px; } #vpanel .cas-side { width: 240px; } }
</style>
</head>

  <div id="loading">Loading...</div>
</div>
<div id="progress"></div>
<div id="lobby"></div>

<div id="vpanel"></div>
